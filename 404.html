<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>404 - Not Found</title>
</head>
<body>
  <script>
    const pathSegmentsToKeep = 0; // custom domain, no repo name
    const l = window.location;
    const pathParts = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    const port = l.port ? ':' + l.port : '';
    const newUrl = l.protocol + '//' + l.hostname + port + '/?/' + pathParts +
                   (l.search ? '&' + l.search.slice(1) : '') + l.hash;
    l.replace(newUrl);
  </script>
</body>
</html>
