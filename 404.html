<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>404 - Not Found</title>
</head>
<body>
  <script>
    const pathSegmentsToKeep = 0; // custom domain, no repo name
    const l = window.location;
    l.replace(
      l.protocol + '//' +
      l.hostname + ':' +
      l.port + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</body>
</html>
