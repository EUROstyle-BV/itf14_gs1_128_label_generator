<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Pagina niet gevonden</title>
  <script>
    const locationState = window.location;
    const requestedPath = locationState.pathname.replace(/^\//, '');
    const query = locationState.search ? `&${locationState.search.slice(1)}` : '';
    const redirectUrl = `${locationState.origin}/?/${requestedPath}${query}${locationState.hash}`;
    locationState.replace(redirectUrl);
  </script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #f5f5f5; }
    h1 { color: #333; }
    p { color: #666; }
    a { color: #0066cc; text-decoration: none; margin: 0 10px; }
    a:hover { text-decoration: underline; }
    .button { display: inline-block; padding: 10px 20px; background: #0066cc; color: white; border-radius: 4px; margin: 10px; }
    .button:hover { background: #0052a3; }
  </style>
</head>
<body>
  <h1>404 - Pagina niet gevonden</h1>
  <p>De URL die je hebt gevraagd bestaat niet.</p>
  <p>
    <a href="/" class="button">← Home</a>
    <a href="/ecostyle" class="button">← Carton Label</a>
    <a href="/ecostyle/pallet" class="button">← Pallet Label</a>
  </p>
</body>
</html>
