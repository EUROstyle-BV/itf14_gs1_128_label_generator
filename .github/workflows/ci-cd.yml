name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install validation tools
        run: npm install --save-dev html-validate eslint stylelint stylelint-config-standard
      
      - name: Validate HTML
        run: npx html-validate index.html
        continue-on-error: true
      
      - name: Lint JavaScript
        run: npx eslint index.html --ext .html,.js
        continue-on-error: true
      
      - name: Check JavaScript syntax
        run: node -c index.html 2>/dev/null || true
      
      - name: Display project info
        run: |
          echo "✓ Project: ITF-14 / GS1-128 Barcode Label Generator"
          echo "✓ Files validated"
          echo "✓ Ready for deployment"

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          cname: labels.eurostyle.nl
          exclude_assets: .github,node_modules,.git

      - name: Deployment successful
        run: echo "✓ Application deployed to GitHub Pages"
