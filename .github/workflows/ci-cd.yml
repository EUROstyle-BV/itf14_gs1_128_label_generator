name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install validation tools
        run: npm install --save-dev html-validate eslint stylelint stylelint-config-standard
      
      - name: Validate HTML
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' html_files < <(
            find . \
              -type f \
              -name '*.html' \
              -not -path './node_modules/*' \
              -print0
          )

          if [ "${#html_files[@]}" -eq 0 ]; then
            echo "Geen HTML-bestanden gevonden."
            exit 1
          fi

          printf 'Valideer HTML-bestanden:\n'
          printf ' - %s\n' "${html_files[@]}"
          npx html-validate "${html_files[@]}"
      
      - name: Lint JavaScript
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' js_files < <(
            find . \
              -type f \
              \( -name '*.js' -o -name '*.mjs' \) \
              -not -path './node_modules/*' \
              -print0
          )

          if [ "${#js_files[@]}" -eq 0 ]; then
            echo "Geen losse JavaScript-bestanden gevonden."
            exit 0
          fi

          npx eslint --max-warnings=0 "${js_files[@]}"
      
      - name: Display project info
        run: |
          echo "✓ Project: ITF-14 / GS1-128 Barcode Label Generator"
          echo "✓ Files validated"
          echo "✓ Ready for deployment"

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build deployment content
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 Checking files before deploy..."

          test -f index.html
          test -f pallet.html
          test -f 404.html
          test -d images
          test -d ecostyle
          test -d vitalstyle
          test -d azstyle

          mkdir -p deploy
          cp index.html deploy/
          cp pallet.html deploy/
          cp 404.html deploy/
          cp -r images deploy/

          # Copy brand directories
          cp -r ecostyle deploy/
          cp -r vitalstyle deploy/
          cp -r azstyle deploy/

          echo "labels.eurostyle.nl" > deploy/CNAME

          echo ""
          echo "📦 Deployment package contents:"
          find deploy -type f | sort

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.6.1
        with:
          branch: gh-pages
          folder: deploy
          clean: true

      - name: Deployment successful
        run: echo "✓ Application deployed to GitHub Pages at https://labels.eurostyle.nl"
